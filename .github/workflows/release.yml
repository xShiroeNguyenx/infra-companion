name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Stage 1: tạo GitHub Release trước — chỉ 1 job, không race
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # electron-builder chỉ upload vào release tên `v${version}` và chỉ publish khi tag khớp
      # version đã build. Lệch nhau thì nó BỎ QUA bước publish mà KHÔNG báo lỗi — job vẫn xanh,
      # release vẫn được tạo, chỉ là rỗng không có installer. Đã dính đúng ca này ở v0.2.5
      # (tag v0.2.5 nhưng 2 package.json còn 0.2.4). Chặn ngay ở đây, TRƯỚC khi tạo release,
      # để không đẻ ra một release rỗng đè mất "Latest" và làm hỏng auto-update của bản đang chạy.
      - name: Tag phải khớp version trong package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          root=$(node -p "require('./package.json').version")
          app=$(node -p "require('./apps/desktop/package.json').version")
          echo "tag=$tag · root=$root · apps/desktop=$app"
          if [ "$tag" != "$root" ] || [ "$tag" != "$app" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} không khớp version (root=$root, apps/desktop=$app). Bump CẢ HAI package.json rồi tag lại — nếu không electron-builder sẽ bỏ qua publish và release ra rỗng."
            exit 1
          fi

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
          || echo "Release already exists, continuing…"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 2: build song song 3 OS, upload vào release vừa tạo
  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # OAuth client Google nhúng LÚC BUILD từ env (electron.vite.config.ts, khối main).
      # Thiếu biến thì bản cài vẫn build được nhưng tính năng Google Drive sync CHẾT IM LẶNG
      # ("chưa cấu hình client") — chặn ở đây cho lộ sớm, cùng lý do với guard version ở trên.
      # Đặt MỘT LẦN tại: Settings → Secrets and variables → Actions → tab Variables
      # (client của Desktop app không phải bí mật — Variables là đủ, Secrets cũng nhận).
      - name: Google OAuth client phải được cấu hình
        shell: bash
        env:
          CID: ${{ vars.INFRA_GOOGLE_CLIENT_ID || secrets.INFRA_GOOGLE_CLIENT_ID }}
          CSECRET: ${{ vars.INFRA_GOOGLE_CLIENT_SECRET || secrets.INFRA_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$CID" ] || [ -z "$CSECRET" ]; then
            echo "::error::Thiếu INFRA_GOOGLE_CLIENT_ID / INFRA_GOOGLE_CLIENT_SECRET (GitHub Variables hoặc Secrets). Bản build ra sẽ không đăng nhập Google được — đặt biến ở Settings → Secrets and variables → Actions rồi chạy lại."
            exit 1
          fi
          echo "OAuth client: OK"

      - name: Build & publish
        run: pnpm dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INFRA_GOOGLE_CLIENT_ID: ${{ vars.INFRA_GOOGLE_CLIENT_ID || secrets.INFRA_GOOGLE_CLIENT_ID }}
          INFRA_GOOGLE_CLIENT_SECRET: ${{ vars.INFRA_GOOGLE_CLIENT_SECRET || secrets.INFRA_GOOGLE_CLIENT_SECRET }}
